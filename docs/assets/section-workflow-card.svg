<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#101314"/>
  <rect x="52" y="52" width="1496" height="896" rx="32" fill="#171C1D" stroke="#F3EBDD" stroke-width="2"/>
  <text x="88" y="138" fill="#F3EBDD" font-size="72" font-family="Georgia, Times New Roman, serif">Section Workflow</text>
  <text x="90" y="188" fill="#B9B0A5" font-size="28" font-family="Helvetica, Arial, sans-serif">A minimum story for docs, demos, and launch materials.</text>

  <rect x="88" y="250" width="1424" height="148" rx="24" fill="#F3EBDD"/>
  <text x="128" y="308" fill="#111111" font-size="28" font-family="Helvetica, Arial, sans-serif">1. Add and bind a source</text>
  <text x="128" y="352" fill="#3B3B3B" font-size="24" font-family="SFMono-Regular, Menlo, monospace">section source add demo --provider fs --opt root=/srv/demo</text>
  <text x="128" y="388" fill="#3B3B3B" font-size="24" font-family="SFMono-Regular, Menlo, monospace">section source bind demo ~/section-demo</text>

  <rect x="88" y="432" width="1424" height="128" rx="24" fill="#0E6B66"/>
  <text x="128" y="490" fill="#FFF9F0" font-size="28" font-family="Helvetica, Arial, sans-serif">2. Sync into the local tree</text>
  <text x="128" y="534" fill="#E8F7F4" font-size="24" font-family="SFMono-Regular, Menlo, monospace">section source sync demo</text>

  <rect x="88" y="594" width="688" height="268" rx="24" fill="#D84C2F"/>
  <text x="128" y="650" fill="#FFF9F0" font-size="28" font-family="Helvetica, Arial, sans-serif">3. Subscribe once</text>
  <text x="128" y="694" fill="#FFF9F0" font-size="24" font-family="SFMono-Regular, Menlo, monospace">section --json watch ~/section-demo</text>
  <text x="128" y="742" fill="#FFD7CC" font-size="22" font-family="SFMono-Regular, Menlo, monospace">{\"path\":\"docs/readme.txt\",\"kind\":\"conflict_detected\",\"state\":\"conflict\"}</text>
  <text x="128" y="792" fill="#FFE9E2" font-size="22" font-family="Helvetica, Arial, sans-serif">Agents should subscribe once, then inspect only when an event names a path.</text>

  <rect x="824" y="594" width="688" height="268" rx="24" fill="#F3EBDD"/>
  <text x="864" y="650" fill="#111111" font-size="28" font-family="Helvetica, Arial, sans-serif">4. Compare and resolve by local path</text>
  <text x="864" y="694" fill="#3B3B3B" font-size="22" font-family="SFMono-Regular, Menlo, monospace">section --json path compare ~/section-demo/docs/readme.txt</text>
  <text x="864" y="734" fill="#3B3B3B" font-size="22" font-family="SFMono-Regular, Menlo, monospace">section --json path resolve ~/section-demo/docs/readme.txt --strategy use-local</text>
  <text x="864" y="792" fill="#5F5A54" font-size="22" font-family="Helvetica, Arial, sans-serif">The local tree is the work surface. The control plane carries sync truth.</text>
</svg>
