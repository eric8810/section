<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1200" fill="#F3EBDD"/>
  <rect x="42" y="42" width="1116" height="1116" rx="30" fill="#FFF9F0" stroke="#111111" stroke-width="2"/>
  <rect x="82" y="86" width="176" height="38" rx="19" fill="#111111"/>
  <text x="170" y="111" fill="#FFF9F0" font-size="18" text-anchor="middle" font-family="Georgia, Times New Roman, serif">SECTION</text>

  <text x="84" y="198" fill="#111111" font-size="76" font-family="Georgia, Times New Roman, serif">One shared folder</text>
  <text x="84" y="278" fill="#111111" font-size="76" font-family="Georgia, Times New Roman, serif">for you</text>
  <text x="84" y="358" fill="#111111" font-size="76" font-family="Georgia, Times New Roman, serif">and your agents.</text>

  <text x="86" y="424" fill="#3A3A3A" font-size="28" font-family="Helvetica, Arial, sans-serif">Connect remote storage. Work locally in familiar tools.</text>
  <text x="86" y="466" fill="#3A3A3A" font-size="28" font-family="Helvetica, Arial, sans-serif">Section keeps sync clear when it actually needs your attention.</text>

  <rect x="84" y="526" width="214" height="62" rx="16" fill="#D84C2F"/>
  <text x="191" y="565" fill="#FFF9F0" font-size="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">connect storage</text>
  <rect x="316" y="526" width="238" height="62" rx="16" fill="#0E6B66"/>
  <text x="435" y="565" fill="#FFF9F0" font-size="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">work in one folder</text>
  <rect x="572" y="526" width="250" height="62" rx="16" fill="#111111"/>
  <text x="697" y="565" fill="#FFF9F0" font-size="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">clear sync state</text>

  <rect x="84" y="652" width="1032" height="340" rx="24" fill="#111111"/>
  <rect x="124" y="696" width="260" height="86" rx="16" fill="#FFF9F0"/>
  <text x="146" y="731" fill="#111111" font-size="24" font-family="Helvetica, Arial, sans-serif">Remote storage</text>
  <text x="146" y="763" fill="#4F4F4F" font-size="20" font-family="Helvetica, Arial, sans-serif">S3 / WebDAV / NAS / local fs</text>

  <rect x="430" y="696" width="236" height="86" rx="16" fill="#D84C2F"/>
  <text x="454" y="731" fill="#FFF9F0" font-size="24" font-family="Helvetica, Arial, sans-serif">Section</text>
  <text x="454" y="763" fill="#FFF9F0" font-size="19" font-family="Helvetica, Arial, sans-serif">syncs and surfaces state</text>

  <rect x="712" y="696" width="364" height="86" rx="16" fill="#FFF9F0"/>
  <text x="736" y="731" fill="#111111" font-size="24" font-family="Helvetica, Arial, sans-serif">Your local folder</text>
  <text x="736" y="763" fill="#4F4F4F" font-size="20" font-family="Helvetica, Arial, sans-serif">Finder / terminal / editor / agent</text>

  <path d="M384 739H430" stroke="#FFF9F0" stroke-width="4"/>
  <path d="M666 739H712" stroke="#FFF9F0" stroke-width="4"/>

  <text x="126" y="844" fill="#F3EBDD" font-size="22" font-family="Helvetica, Arial, sans-serif">Why this feels simpler:</text>
  <text x="126" y="888" fill="#F3EBDD" font-size="20" font-family="Helvetica, Arial, sans-serif">• you keep working in normal local tools</text>
  <text x="126" y="924" fill="#F3EBDD" font-size="20" font-family="Helvetica, Arial, sans-serif">• humans and agents share the same files</text>
  <text x="126" y="960" fill="#F3EBDD" font-size="20" font-family="Helvetica, Arial, sans-serif">• sync state shows up clearly instead of staying hidden</text>
  <text x="84" y="1082" fill="#6A645D" font-size="22" font-family="Helvetica, Arial, sans-serif">connect storage → sync into a folder → keep working locally</text>
</svg>
