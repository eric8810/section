name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  non_fuse:
    name: Non-FUSE checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # Keep CI truthful: the FUSE runtime path is still being validated
      # separately per platform, so this workflow only covers the non-mount
      # crates and scenarios that should stay portable.
      - name: cargo check (non-FUSE crates)
        run: cargo check --locked -p section-core -p section-provider -p section-cli -p sectiond

      - name: cargo clippy (non-FUSE crates)
        run: cargo clippy --locked -p section-core -p section-provider -p section-cli -p sectiond --all-targets -- -D warnings

      - name: cargo test section-core + section-provider
        run: cargo test --locked -p section-core -p section-provider -p sectiond

      - name: cargo test section-cli
        run: cargo test --locked -p section-cli

  section_fuse_linux:
    name: section-fuse checks (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libfuse3 headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfuse3-dev

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy section-fuse
        run: cargo clippy --locked -p section-fuse --all-targets -- -D warnings

      - name: cargo test section-fuse
        run: cargo test --locked -p section-fuse

  npm_distribution:
    name: npm distribution checks (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Syntax check npm shims
        run: |
          node --check packaging/npm/bin/section.js
          node --check packaging/npm/bin/sectiond.js
          node --check packaging/npm/lib/runtime.js
          node --check packaging/npm/scripts/postinstall.js

      - name: npm pack dry run
        working-directory: packaging/npm
        run: npm pack --dry-run
